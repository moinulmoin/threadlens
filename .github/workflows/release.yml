name: Release

# Final tag (e.g. v1.1.0) -> build + publish the Python CLI.
# Pre-release tag (e.g. v1.1.0-rc.1) or manual dispatch -> build + smoke only
# (publish/release jobs are skipped). Use that as a full dry run before the real tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test CLI
        run: |
          python -B -m py_compile threadlens/*.py
          python -B -m unittest discover -s tests
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify wheel install
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          threadlens --version
          threadlens skill --json
      - uses: actions/upload-artifact@v4
        with:
          name: threadlens-python-dist
          path: dist/*

  publish-pypi:
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: threadlens-python-dist
          path: dist
      - name: Check if version already on PyPI
        id: check
        run: |
          version="$(ls dist/*.whl | sed -E 's/.*threadlens-([0-9][^-]*)-.*/\1/')"
          if curl -fsS "https://pypi.org/pypi/threadlens/$version/json" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: threadlens-python-dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

  raycast:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - run: npm ci
      - run: npm run build
